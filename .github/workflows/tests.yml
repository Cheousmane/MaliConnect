name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  sqlite:
    name: SQLite (PHP 8.2)
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Installation des dépendances JavaScript
        run: npm ci

      - name: Préparation de l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migration et seed de vérification
        run: php artisan migrate:fresh --seed --force

      - name: Compilation des assets
        run: npm run build

      - name: Tests
        run: ./vendor/bin/pest

  postgresql:
    name: PostgreSQL 17 (PHP 8.2)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: maliconnect_test
          POSTGRES_USER: maliconnect
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: maliconnect_test
      DB_USERNAME: maliconnect
      DB_PASSWORD: secret

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Installation des dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Préparation de l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migration et seed de vérification
        run: php artisan migrate:fresh --seed --force

      - name: Tests
        run: ./vendor/bin/pest
