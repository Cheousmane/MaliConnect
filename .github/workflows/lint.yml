name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Installation des dépendances JavaScript
        run: npm ci

      - name: Validation de composer.json
        run: composer validate --strict

      - name: Vérification du style PHP
        run: vendor/bin/pint --test

      - name: Vérification du formatage frontend
        run: npm run format:check

      - name: Vérification ESLint
        run: npm run lint:check

      - name: Vérification TypeScript
        run: npm run type-check
